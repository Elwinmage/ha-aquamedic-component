name: Update Stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch and Calculate
        run: |
          DATA=$(curl -s https://analytics.home-assistant.io/custom_integrations.json)
          # On force la valeur à 0 si elle est nulle ou absente
          REAL_COUNT=$(echo "$DATA" | jq '.aquamedic.total // 0')
          
          if [ "$REAL_COUNT" -eq 0 ]; then
            ESTIMATED_COUNT=2
          else
            ESTIMATED_COUNT=$((REAL_COUNT * 4))
          fi
          
          echo "{\"estimated\": $ESTIMATED_COUNT}" > ./badges/stats.json
      
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ./badges/stats.json
          git commit -m "Update estimated stats" || exit 0
          git push
